<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">computer-repair-skill：电脑诊断与安全维修</title>
  <desc id="desc">一套面向 Agent 的跨平台电脑诊断与安全维修 Skill，覆盖证据采集、风险判断、最小变更和结果验证。</desc>
  <style>
    .sans { font-family: "Inter", "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
    .trace { animation: trace 7s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse-delay { animation-delay: .9s; }
    .pulse-delay-2 { animation-delay: 1.8s; }
    .scan { animation: scan 4.8s ease-in-out infinite; }
    @keyframes trace { to { stroke-dashoffset: -420; } }
    @keyframes pulse { 0%, 100% { opacity: .3; transform: scale(.78); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes scan { 0%, 12% { transform: translateY(0); opacity: 0; } 22% { opacity: .8; } 82% { opacity: .8; } 100% { transform: translateY(220px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .trace, .pulse, .pulse-delay, .pulse-delay-2, .scan { animation: none; }
    }
  </style>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#adc1d2" stroke-width="1" opacity=".16"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#050a12" flood-opacity=".34"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="display-clip"><rect x="963" y="216" width="470" height="244" rx="16"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#0d172a"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".46"/>
  <path d="M780 0H1600V900H1030C1125 703 1050 540 1138 378 1217 234 1266 116 780 0Z" fill="#13233d"/>
  <path d="M782 0C1260 104 1193 258 1138 378S1124 690 1030 900" fill="none" stroke="#25415f" stroke-width="2"/>
  <path d="M798 0C1275 104 1209 258 1153 378S1140 690 1046 900" fill="none" stroke="#ef805f" stroke-width="2" stroke-dasharray="4 18" class="trace"/>
  <path d="M0 785H870" stroke="#203650" stroke-width="2"/>

  <g class="sans">
    <g transform="translate(88 48)">
      <rect width="58" height="58" rx="16" fill="#d7f36b"/>
      <rect x="14" y="12" width="30" height="23" rx="4" fill="none" stroke="#101d3d" stroke-width="3"/>
      <path d="M19 45h20M29 35v10" fill="none" stroke="#101d3d" stroke-width="3" stroke-linecap="round"/>
      <path d="m40 8 11 11-10 10-11-11z" fill="#ef805f"/>
    </g>
    <text x="166" y="80" class="mono" font-size="45" font-weight="800" fill="#ffffff">computer-repair-skill</text>
    <text x="166" y="108" font-size="18" font-weight="700" fill="#d7f36b" letter-spacing="1">开源 · 跨平台 · Agent 电脑维修工作流</text>
    <rect x="1142" y="49" width="360" height="42" rx="21" fill="#1b2d48" stroke="#3b5775" stroke-width="1"/>
    <circle cx="1170" cy="70" r="7" fill="#58d5b5" class="pulse"/>
    <text x="1190" y="76" font-size="18" font-weight="800" fill="#d9e7ef">只读优先 · 确认后变更</text>

    <text x="88" y="244" font-size="92" font-weight="850" fill="#ffffff">电脑诊断</text>
    <text x="88" y="344" font-size="92" font-weight="850" fill="#ffffff">与安全维修</text>
    <rect x="92" y="380" width="238" height="8" rx="4" fill="#ef805f"/>
    <text x="88" y="438" font-size="30" font-weight="800" fill="#d7f36b">从证据开始，让修复有据可查。</text>
    <text x="88" y="481" font-size="22" fill="#c1d0dc">把电脑变慢、系统清理、性能优化、网络修复交给 Agent，</text>
    <text x="88" y="515" font-size="22" fill="#c1d0dc">按平台和风险选择流程，先说明影响，再执行最小变更。</text>

    <g transform="translate(88 575)">
      <path d="M23 20H670" stroke="#3a5571" stroke-width="3"/>
      <path d="M23 20H670" stroke="#ef805f" stroke-width="3" stroke-dasharray="4 15" class="trace"/>
      <g>
        <circle cx="23" cy="20" r="12" fill="#58d5b5"/>
        <circle cx="23" cy="20" r="24" fill="#58d5b5" opacity=".18" class="pulse"/>
        <text x="0" y="64" class="mono" font-size="15" fill="#a5b8c8">01</text>
        <text x="0" y="91" font-size="22" font-weight="800" fill="#ffffff">证据优先</text>
        <text x="0" y="119" font-size="16" fill="#a9bdce">日志 · 配置 · 硬件状态</text>
      </g>
      <g transform="translate(220)">
        <circle cx="23" cy="20" r="12" fill="#58d5b5"/>
        <circle cx="23" cy="20" r="24" fill="#58d5b5" opacity=".18" class="pulse pulse-delay"/>
        <text x="0" y="64" class="mono" font-size="15" fill="#a5b8c8">02</text>
        <text x="0" y="91" font-size="22" font-weight="800" fill="#ffffff">风险判断</text>
        <text x="0" y="119" font-size="16" fill="#a9bdce">影响 · 权限 · 回滚</text>
      </g>
      <g transform="translate(440)">
        <circle cx="23" cy="20" r="12" fill="#d7f36b"/>
        <circle cx="23" cy="20" r="24" fill="#d7f36b" opacity=".22" class="pulse pulse-delay-2"/>
        <text x="0" y="64" class="mono" font-size="15" fill="#a5b8c8">03</text>
        <text x="0" y="91" font-size="22" font-weight="800" fill="#ffffff">最小变更</text>
        <text x="0" y="119" font-size="16" fill="#a9bdce">确认 · 执行 · 留痕</text>
      </g>
      <g transform="translate(660)">
        <circle cx="23" cy="20" r="12" fill="#ef805f"/>
        <circle cx="23" cy="20" r="24" fill="#ef805f" opacity=".2" class="pulse"/>
        <text x="0" y="64" class="mono" font-size="15" fill="#a5b8c8">04</text>
        <text x="0" y="91" font-size="22" font-weight="800" fill="#ffffff">验证收尾</text>
        <text x="0" y="119" font-size="16" fill="#a9bdce">结果 · 报告 · 交接</text>
      </g>
    </g>
    <text x="88" y="843" class="mono" font-size="16" fill="#a6b8c8" letter-spacing="2">WINDOWS · MACOS · LINUX</text>
    <text x="88" y="872" font-size="17" fill="#c6d4df">网络 · 性能 · 存储 · 启动 · 数据恢复 · 安全审计</text>
  </g>

  <g class="sans">
    <text x="900" y="128" class="mono" font-size="16" font-weight="700" fill="#9bb1c4" letter-spacing="2">现场工作台 / 诊断信号</text>
    <g filter="url(#shadow)">
      <rect x="886" y="158" width="574" height="488" rx="28" fill="#f6f1e7" stroke="#d7f36b" stroke-width="3"/>
      <rect x="930" y="198" width="530" height="320" rx="22" fill="#111f38"/>
      <g clip-path="url(#display-clip)">
        <rect x="963" y="216" width="470" height="244" fill="#172b4e"/>
        <path d="M963 264H1433M963 312H1433M963 360H1433M963 408H1433" stroke="#2b456c" stroke-width="1"/>
        <path d="M987 427 C1020 412 1042 372 1072 386 S1119 438 1150 405 S1191 302 1224 332 S1270 396 1304 366 S1344 311 1377 325 S1409 300 1445 271" fill="none" stroke="#58d5b5" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 13" class="trace"/>
        <path d="M987 427 C1020 412 1042 372 1072 386 S1119 438 1150 405 S1191 302 1224 332 S1270 396 1304 366 S1344 311 1377 325 S1409 300 1445 271" fill="none" stroke="#58d5b5" stroke-width="18" opacity=".14" filter="url(#glow)"/>
        <rect x="963" y="216" width="470" height="3" fill="#d7f36b" class="scan"/>
      </g>
      <text x="972" y="244" font-size="22" font-weight="800" fill="#ffffff">系统健康曲线</text>
      <text x="972" y="271" class="mono" font-size="16" fill="#9fb3c8">网络 / 性能 / 存储 / 安全</text>
      <rect x="1308" y="228" width="102" height="28" rx="14" fill="#d7f36b"/>
      <text x="1359" y="248" text-anchor="middle" class="mono" font-size="18" font-weight="800" fill="#101d3d">只读检查</text>
      <g transform="translate(966 542)">
        <rect width="144" height="58" rx="13" fill="#e3f3ed"/>
        <text x="55" y="24" class="mono" font-size="16" fill="#52747b">网络</text>
        <text x="55" y="46" font-size="17" font-weight="800" fill="#19836d">稳定</text>
        <rect x="160" width="144" height="58" rx="13" fill="#fff0e6"/>
        <text x="215" y="24" class="mono" font-size="16" fill="#8a6a5f">存储</text>
        <text x="215" y="46" font-size="17" font-weight="800" fill="#d66d44">关注</text>
        <rect x="320" width="144" height="58" rx="13" fill="#e3f3ed"/>
        <text x="375" y="24" class="mono" font-size="16" fill="#52747b">安全</text>
        <text x="375" y="46" font-size="17" font-weight="800" fill="#19836d">开启</text>
      </g>
      <path d="M1060 646v42M1275 646v42" stroke="#263e61" stroke-width="14"/>
      <path d="M962 706h420" stroke="#263e61" stroke-width="26" stroke-linecap="round"/>
    </g>

    <g transform="translate(1360 640)">
      <circle cx="92" cy="92" r="92" fill="#d7f36b"/>
      <circle cx="92" cy="92" r="72" fill="none" stroke="#101d3d" stroke-width="2" stroke-dasharray="3 11" class="trace"/>
      <text x="92" y="92" text-anchor="middle" class="mono" font-size="43" font-weight="900" fill="#101d3d">58</text>
      <text x="92" y="121" text-anchor="middle" font-size="20" font-weight="800" fill="#101d3d">个专项流程</text>
    </g>
    <path d="M1452 620v22" stroke="#d7f36b" stroke-width="3" stroke-dasharray="4 8" class="trace"/>
    <text x="936" y="842" font-size="20" font-weight="800" fill="#ffffff">适合日常维护，也适合真实维修现场。</text>
    <text x="936" y="872" font-size="17" fill="#a9bdd0">不靠猜测 · 不盲目提权 · 不跳过验证</text>
