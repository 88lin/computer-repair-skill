<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Computer Care：电脑诊断与维修 Skill</title>
  <desc id="desc">浅色中文产品封面，展示电脑健康检查、证据优先和安全维修流程。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#edf4f0"/>
    </linearGradient>
    <linearGradient id="display" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123447"/>
      <stop offset="1" stop-color="#1d5360"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54c8b2"/>
      <stop offset="1" stop-color="#1c9b91"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#163444" flood-opacity=".16"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#9dbfba" stroke-width="1" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#grid)" opacity=".36"/>
  <path d="M0 760C250 690 470 830 745 750c280-80 559-64 855 12v138H0Z" fill="#d9ebe5" opacity=".72"/>
  <circle cx="1460" cy="82" r="230" fill="#cfe7df" opacity=".8"/>
  <circle cx="1460" cy="82" r="150" fill="none" stroke="#83bdb1" stroke-width="3" opacity=".45"/>
  <circle cx="1460" cy="82" r="88" fill="none" stroke="#83bdb1" stroke-width="2" stroke-dasharray="7 12" opacity=".42"/>

  <g font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif">
    <g transform="translate(96 78)">
      <rect width="62" height="62" rx="18" fill="#123447"/>
      <rect x="15" y="14" width="32" height="25" rx="4" fill="none" stroke="#54c8b2" stroke-width="3"/>
      <path d="M20 47h22M31 39v8" stroke="#54c8b2" stroke-width="3" stroke-linecap="round"/>
      <path d="m42 9 10 10-11 11-10-10z" fill="#ed9b52"/>
    </g>
    <text x="180" y="112" font-size="29" font-weight="800" fill="#123447" letter-spacing="2">COMPUTER CARE</text>
    <text x="180" y="146" font-size="18" fill="#58747c">开源电脑诊断与维修技能</text>

    <text x="96" y="282" font-size="78" font-weight="800" fill="#123447">电脑诊断</text>
    <text x="96" y="370" font-size="78" font-weight="800" fill="#123447">与维修</text>
    <text x="99" y="438" font-size="29" font-weight="700" fill="#e4864b">先诊断，再修复</text>
    <text x="99" y="483" font-size="23" fill="#58747c">让 Agent 帮你找出问题，按可控步骤完成维护。</text>

    <g transform="translate(99 546)">
      <circle cx="18" cy="18" r="18" fill="#1c9b91"/>
      <path d="m10 18 6 6 12-14" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="26" font-size="23" font-weight="700" fill="#123447">证据优先</text>
      <circle cx="18" cy="76" r="18" fill="#1c9b91"/>
      <path d="m10 76 6 6 12-14" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="84" font-size="23" font-weight="700" fill="#123447">确认后执行</text>
      <circle cx="18" cy="134" r="18" fill="#1c9b91"/>
      <path d="m10 134 6 6 12-14" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="142" font-size="23" font-weight="700" fill="#123447">验证再收尾</text>
    </g>

    <g transform="translate(804 126)" filter="url(#shadow)">
      <rect x="0" y="0" width="620" height="420" rx="30" fill="#ffffff" stroke="#d5e5df" stroke-width="3"/>
      <rect x="32" y="32" width="556" height="326" rx="18" fill="url(#display)"/>
      <circle cx="65" cy="66" r="7" fill="#ef826a"/><circle cx="89" cy="66" r="7" fill="#edaa58"/><circle cx="113" cy="66" r="7" fill="#63d2bd"/>
      <text x="64" y="122" font-size="27" font-weight="700" fill="#ffffff">电脑健康检查</text>
      <text x="64" y="154" font-size="17" fill="#afd0cc">只读扫描 · 等待用户确认</text>
      <path d="M64 184h488" stroke="#4e7880" stroke-width="2"/>
      <g font-size="18" font-weight="700">
        <text x="64" y="231" fill="#d2e5e1">网络</text><text x="64" y="284" fill="#d2e5e1">性能</text><text x="64" y="337" fill="#d2e5e1">存储</text>
        <text x="464" y="231" fill="#70d6bc">正常</text><text x="464" y="284" fill="#edb25e">关注</text><text x="464" y="337" fill="#70d6bc">正常</text>
      </g>
      <g fill="#315d69"><rect x="164" y="218" width="260" height="12" rx="6"/><rect x="164" y="271" width="260" height="12" rx="6"/><rect x="164" y="324" width="260" height="12" rx="6"/></g>
      <g fill="#70d6bc"><rect x="164" y="218" width="223" height="12" rx="6"/><rect x="164" y="324" width="242" height="12" rx="6"/></g>
      <rect x="32" y="379" width="556" height="41" rx="13" fill="#e5f2ee"/>
      <text x="64" y="406" font-size="17" font-weight="700" fill="#1c716b">安全控制保持开启 · 不输出敏感凭据</text>
      <path d="M224 420v62M396 420v62" stroke="#2d5965" stroke-width="12"/>
      <path d="M126 503h368" stroke="#2d5965" stroke-width="22" stroke-linecap="round"/>
    </g>

    <g transform="translate(1332 270)" filter="url(#shadow)">
      <circle cx="84" cy="84" r="84" fill="#ffffff" stroke="#a6d2c7" stroke-width="3"/>
      <path d="M84 25 135 46v54c0 48-25 80-51 94-26-14-51-46-51-94V46Z" fill="#123447" stroke="#54c8b2" stroke-width="6"/>
      <path d="m54 94 21 21 45-50" fill="none" stroke="#edaa58" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(790 620)">
      <text x="0" y="0" font-size="22" font-weight="800" fill="#123447">覆盖范围</text>
      <text x="0" y="40" font-size="20" fill="#58747c">Windows · macOS · Linux</text>
      <g font-size="18" fill="#58747c">
        <text x="0" y="79">网络 · 性能 · 存储 · 更新 · 打印</text>
        <text x="0" y="112">驱动 · 启动 · BitLocker · 数据恢复</text>
      </g>
      <rect x="0" y="144" width="590" height="70" rx="16" fill="#123447"/>
      <text x="28" y="175" font-size="20" font-weight="700" fill="#63d2bd">58 个可按需加载的专项流程</text>
      <text x="28" y="199" font-size="15" fill="#c7dfdb">从只读检查到确认后的最小修复</text>
    </g>

    <g transform="translate(100 790)">
      <rect width="510" height="54" rx="27" fill="#123447"/>
      <text x="255" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">适合日常维护，也适合维修现场</text>
    </g>
  </g>
</svg>
