name: Release

# SKILL.md 的 version 变化后自动打 tag 并发布，说明正文从 CHANGELOG 摘录。
# Release 已存在才跳过；tag 存在而发布失败时，从该 tag 恢复发布。
on:
  push:
    branches: [main]
    paths:
      - "skills/computer-repair-skill/SKILL.md"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # 需要完整历史与已有 tag，才能判断该版本是否已发布。
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(python tools/release_notes.py --print-version)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" > /dev/null 2> "$RUNNER_TEMP/release-check.err"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version 已发布，跳过。"
          else
            if ! grep -q 'HTTP 404' "$RUNNER_TEMP/release-check.err"; then
              cat "$RUNNER_TEMP/release-check.err" >&2
              exit 1
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "准备发布 v$version。"
          fi
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore tagged source for a release retry
        if: steps.version.outputs.exists == 'false' && steps.version.outputs.tag_exists == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git checkout --detach "refs/tags/v$VERSION"
          test "$(python tools/release_notes.py --print-version)" = "$VERSION"

      - name: Validate before releasing
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          python tools/extract_data.py --check
          python tools/build_site.py --check
          python tests/validate_skill.py
          python -m unittest discover -s tests -p "test_*.py"

      - name: Build release notes
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: python tools/release_notes.py --output "$RUNNER_TEMP/release-notes.md"

      - name: Create annotated tag
        if: steps.version.outputs.exists == 'false' && steps.version.outputs.tag_exists == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "$VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: Publish GitHub Release
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag \
            --latest
